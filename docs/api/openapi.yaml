openapi: 3.1.0
info:
  title: Trita API
  version: "2026-08-23"
  description: |
    Trita platform belső API-leírója — kézzel karbantartott, a route-fájlok
    Zod-sémáiból származtatva. Auth: Clerk session cookie (böngésző-hívások),
    kivéve a jelölt publikus, token-alapú végpontokat.

    Csoportok (tags): Public · Assessment · Observer · Profile · Notifications
    · Feedback · Team · TeamRoles/Trust/PsychSafety · Org · Manager/Hiring
    · Admin · Inquiry · System.

    Generálás: a projekt sima Next.js route-handlereket használ (nincs
    dekorátor-réteg), ezért teljesen automatikus generátor nincs bekötve.
    Ajánlott irány: zod-openapi (a meglévő Zod-sémák annotálása) vagy
    next-rest-framework — lásd docs/security/security-audit-2026-07-22.md.

servers:
  - url: https://trita.io
  - url: http://localhost:3000

components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk session cookie — a böngésző automatikusan küldi.
    cronBearer:
      type: http
      scheme: bearer
      description: CRON_SECRET Bearer tokenként (Vercel cron).
    svixSignature:
      type: apiKey
      in: header
      name: svix-signature
      description: Svix webhook aláírás (svix-id + svix-timestamp + svix-signature).
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, description: "Rövid hibakód (pl. UNAUTHORIZED, INVALID_PAYLOAD)" }
    Ok:
      type: object
      properties:
        ok: { type: boolean }
    Answer:
      type: object
      required: [questionId, value]
      properties:
        questionId: { type: integer, minimum: 1 }
        value: { type: integer, minimum: 1, maximum: 5 }

security:
  - clerkSession: []

tags:
  - name: Public
    description: Auth nélkül hívható végpontok (rate-limitelt / token-alapú)
  - name: Assessment
  - name: Observer
  - name: Profile
  - name: Notifications
  - name: Feedback
  - name: Team
  - name: TeamRoles
  - name: Org
  - name: Manager
  - name: Admin
    description: Csak ADMIN_EMAILS (requireAdmin)
  - name: Inquiry
  - name: System

paths:
  # ── Public ────────────────────────────────────────────────────────────────
  /api/contact:
    post:
      tags: [Public, Inquiry]
      summary: Kapcsolat űrlap beküldése (Inquiry-pipeline + admin email)
      security: []
      description: Rate limit "contact" (3/perc/IP). Honeypot mező (website).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, topic, message]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email, maxLength: 320 }
                company: { type: string, maxLength: 120 }
                topic: { type: string, enum: [demo, pricing, support, partnership, other] }
                message: { type: string, minLength: 20, maxLength: 4000 }
                website: { type: string, description: "Honeypot — kitöltve csendben eldobjuk" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: Invalid payload }
        "429": { description: Rate limited }
        "502": { description: Persist failed }
  /api/pilot-apply:
    post:
      tags: [Public]
      summary: Pilot-jelentkezés (publikus űrlap)
      security: []
      responses: { "200": { description: OK } }
  /api/candidate/{token}:
    get:
      tags: [Public, Manager]
      summary: Jelölt-meghívó kontextus lekérése (publikus, token-alapú)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Meghívó-kontextus }
        "404": { description: Érvénytelen token }
  /api/candidate/{token}/progress:
    patch:
      tags: [Public, Manager]
      summary: Jelölt kitöltési progress mentése
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [answeredCount]
              properties:
                answeredCount: { type: integer, minimum: 0, maximum: 500 }
      responses: { "200": { description: OK } }
  /api/candidate/{token}/submit:
    post:
      tags: [Public, Manager]
      summary: Jelölt teszt beküldése
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { $ref: "#/components/schemas/Answer" }
      responses: { "200": { description: OK } }

  # ── Observer (token-alapú publikus + belépett meghívó-kezelés) ───────────
  /api/observer/draft:
    post:
      tags: [Observer, Public]
      summary: Observer kitöltés-piszkozat mentése (token-alapú, auth nélkül)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, phase, relationshipType, knownDuration, answers, currentPage]
              properties:
                token: { type: string }
                phase: { type: string, enum: [intro, assessment, confidence] }
                relationshipType: { type: string }
                knownDuration: { type: string }
                answers: { type: object, additionalProperties: { type: integer, minimum: 1, maximum: 5 } }
                currentPage: { type: integer, minimum: 0 }
      responses: { "200": { description: OK } }
    delete:
      tags: [Observer, Public]
      summary: Observer piszkozat törlése
      security: []
      responses: { "200": { description: OK } }
  /api/observer/submit:
    post:
      tags: [Observer, Public]
      summary: Observer értékelés beküldése (token-alapú, auth nélkül)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, relationshipType, knownDuration, answers]
              properties:
                token: { type: string }
                relationshipType: { type: string, enum: [FRIEND, COLLEAGUE, FAMILY, PARTNER, OTHER] }
                knownDuration: { type: string }
                answers:
                  type: array
                  items: { $ref: "#/components/schemas/Answer" }
                confidence: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200": { description: OK }
        "404": { description: INVALID_TOKEN }
  /api/observer/invite:
    get:
      tags: [Observer]
      summary: Saját observer-meghívók listája
      responses: { "200": { description: Meghívó-lista } }
    post:
      tags: [Observer]
      summary: Observer-meghívó létrehozása (email vagy kolléga)
      description: Rate-limitelt; max 5 aktív meghívó; kolléga-meghívó jóváhagyást igényelhet.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                colleagueUserId: { type: string, description: "Kolléga-meghívó — email-lel kölcsönösen kizáró" }
                email: { type: string, format: email }
                name: { type: string, maxLength: 100 }
                externalContext: { type: string, maxLength: 200 }
      responses: { "200": { description: Meghívó + token } }
  /api/observer/invite/{id}:
    delete:
      tags: [Observer]
      summary: Saját meghívó visszavonása
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }
  /api/observer/invite/{id}/decision:
    post:
      tags: [Observer, Org]
      summary: Kolléga-meghívó jóváhagyása/elutasítása (manager)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, decline] }
      responses: { "200": { description: OK } }
  /api/observer/link:
    post:
      tags: [Observer]
      summary: Observer-token hozzákötése a belépett profilhoz
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: OK }
        "409": { description: OBSERVER_MISMATCH / ALREADY_USED }
  /api/observer/colleagues:
    get:
      tags: [Observer, Org]
      summary: Meghívható kollégák listája (org-tagság alapján)
      responses: { "200": { description: Kolléga-lista } }

  # ── Assessment ────────────────────────────────────────────────────────────
  /api/assessment/questions:
    get:
      tags: [Assessment]
      summary: Kérdésbank lekérése (belépett user testType-ja szerint)
      responses: { "200": { description: Kérdéslista } }
  /api/assessment/draft:
    post:
      tags: [Assessment]
      summary: Kitöltés-piszkozat mentése (szerver-szinkron)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [answers, currentPage]
              properties:
                answers: { type: object, additionalProperties: { type: integer, minimum: 1, maximum: 5 } }
                currentPage: { type: integer, minimum: 0 }
      responses: { "200": { description: OK } }
    delete:
      tags: [Assessment]
      summary: Piszkozat törlése
      responses: { "200": { description: OK } }
  /api/assessment/submit:
    post:
      tags: [Assessment]
      summary: Önértékelő teszt beküldése (score-számítás)
      description: Rate-limitelt.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [testType, answers]
              properties:
                testType: { type: string, enum: [TRITAN] }
                answers:
                  type: array
                  items: { $ref: "#/components/schemas/Answer" }
      responses: { "200": { description: Eredmény-azonosító } }
  /api/assessment/claim-guest:
    post:
      tags: [Assessment]
      summary: Vendég-kitöltés (/try) átvétele belépés után
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { $ref: "#/components/schemas/Answer" }
      responses: { "200": { description: OK } }
  /api/assessment/skip:
    post:
      tags: [Assessment]
      summary: Teszt kihagyása (org-tag onboarding)
      responses: { "200": { description: OK } }

  # ── Profile ───────────────────────────────────────────────────────────────
  /api/profile/onboarding:
    get:
      tags: [Profile]
      summary: Saját profil + tagságok lekérése
      responses: { "200": { description: Profil }, "401": { description: Unauthorized } }
    post:
      tags: [Profile]
      summary: Onboarding-adatok mentése
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username, birthYear, gender]
              properties:
                username: { type: string, minLength: 2, maxLength: 20 }
                birthYear: { type: integer }
                gender: { type: string, enum: [male, female, other, prefer_not_to_say] }
                country: { type: string, maxLength: 100 }
                consentedAt: { type: string, format: date-time }
                eduLevel: { type: string, enum: [primary, secondary, vocational, higher] }
                eduField: { type: string }
                currentIndustry: { type: string, maxLength: 50 }
      responses: { "200": { description: OK } }
  /api/profile/username:
    patch:
      tags: [Profile]
      summary: Felhasználónév módosítása
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, minLength: 2, maxLength: 20 }
      responses: { "200": { description: OK } }
  /api/profile/locale:
    get: { tags: [Profile], summary: Nyelv lekérése, responses: { "200": { description: OK } } }
    post:
      tags: [Profile]
      summary: Nyelv mentése (DB = source of truth)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties: { locale: { type: string, minLength: 2 } }
      responses: { "200": { description: OK } }
  /api/profile/career-background:
    post:
      tags: [Profile]
      summary: Karrier-háttér mentése (Karrier-iránytű)
      description: Rate-limitelt.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status, eduLevel, eduField, ageBand, currentIndustry, interests]
              properties:
                status: { type: string, enum: [studying, working, switching] }
                eduLevel: { type: [string, "null"] }
                eduField: { type: [string, "null"] }
                ageBand: { type: [string, "null"], enum: [under20, 20s, 30s, 40s, 50plus, null] }
                currentIndustry: { type: [string, "null"] }
                interests: { type: array, maxItems: 3, items: { type: string } }
      responses: { "200": { description: OK } }
  /api/profile/status:
    get: { tags: [Profile], summary: Profil-állapot (journey-hez), responses: { "200": { description: OK } } }
  /api/profile/delete:
    post:
      tags: [Profile]
      summary: Fiók törlése (soft delete + Clerk user törlés)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, const: DELETE }
      responses: { "200": { description: OK } }
  /api/profile/share:
    post:
      tags: [Profile]
      summary: Megosztási token létrehozása / visszaadása (legutóbbi self-eredmény)
      responses: { "200": { description: "{ token }" } }
    delete:
      tags: [Profile]
      summary: Megosztás visszavonása (minden self-eredmény tokenje törlődik)
      responses: { "200": { description: OK } }
  /api/profile/share/send:
    post:
      tags: [Profile]
      summary: Megosztási link kiküldése emailben
      description: Rate limit "contact" (userId-alapú).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email, maxLength: 254 } }
      responses:
        "200": { description: OK }
        "429": { description: Rate limited }
        "500": { description: SEND_FAILED }

  # ── Notifications ─────────────────────────────────────────────────────────
  /api/notifications:
    get: { tags: [Notifications], summary: Saját értesítések listája, responses: { "200": { description: OK } } }
  /api/notifications/unread-count:
    get: { tags: [Notifications], summary: Olvasatlan darabszám, responses: { "200": { description: OK } } }
  /api/notifications/mark-read:
    post:
      tags: [Notifications]
      summary: Értesítések olvasottra állítása
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids]
                  properties: { ids: { type: array, items: { type: string } } }
                - type: object
                  required: [all]
                  properties: { all: { type: boolean, const: true } }
      responses: { "200": { description: OK } }
  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Értesítés elrejtése (soft dismiss, csak sajátra hat)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OK } }

  # ── Feedback ──────────────────────────────────────────────────────────────
  /api/feedback:
    post: { tags: [Feedback], summary: Elégedettség-visszajelzés (satisfaction), responses: { "200": { description: OK } } }
  /api/feedback/dimension:
    post:
      tags: [Feedback]
      summary: Dimenzió-pontosság visszajelzés
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [assessmentResultId, dimensionCode, accuracyRating]
              properties:
                assessmentResultId: { type: string }
                dimensionCode: { type: string, maxLength: 4 }
                accuracyRating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 2000 }
      responses: { "200": { description: OK } }
  /api/industry-fit/feedback:
    post:
      tags: [Feedback]
      summary: Szerep-illeszkedés kalibráció ("találó volt?")
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [occupationId, fitScore, verdict]
              properties:
                occupationId:
                  type: string
                  maxLength: 20
                  description: O*NET-SOC kód a v2 katalógusból (pl. 15-1252.00)
                fitScore: { type: integer, minimum: 0, maximum: 100 }
                verdict: { type: string, enum: [accurate, inaccurate] }
      responses: { "200": { description: OK } }
  /api/career/fit:
    post:
      tags: [Career]
      summary: Karrier-illeszkedés számítása (motor v2, klaszterezett eredmény)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prefs:
                  type: object
                  description: "tengelyenként -1 | 0 | 1 (people, variety, autonomy, creation, pace, structure, setting)"
                leadIntent: { type: string, enum: [lead, expert, unsure] }
                eduLevel: { type: string, enum: [primary, secondary, vocational, higher], nullable: true }
                industries: { type: array, maxItems: 3, items: { type: string } }
                currentIndustry: { type: string, nullable: true }
                limit: { type: integer, minimum: 1, maximum: 40 }
                readyOnly: { type: boolean }
      responses:
        "200": { description: OK }
        "409": { description: NO_ASSESSMENT — nincs kitöltött önértékelés }
  /api/feature-interest:
    post:
      tags: [Feedback]
      summary: "Deprecated — 308 átirányítás: /api/features/interest?legacy=lead"
      deprecated: true
      responses: { "308": { description: Permanent Redirect } }
  /api/features/interest:
    get: { tags: [Feedback], summary: Saját érdeklődés-jelzések, responses: { "200": { description: OK } } }
    post:
      tags: [Feedback]
      summary: "Feature-érdeklődés — mode:lead (meleg lead + admin email) / mode:wishlist (toggle)"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [mode, featureKey]
                  properties:
                    mode: { type: string, enum: [lead] }
                    featureKey: { type: string, enum: [team, industry_role] }
                    message: { type: string, maxLength: 2000 }
                - type: object
                  required: [mode, featureKey]
                  properties:
                    mode: { type: string, enum: [wishlist] }
                    featureKey: { type: string, enum: [team, comm, "360"] }
      responses:
        "200": { description: OK }
        "429": { description: Rate limited }

  # ── Inquiry (in-app kérdés) ───────────────────────────────────────────────
  /api/inquiry:
    post:
      tags: [Inquiry]
      summary: In-app kérdés beküldése (help-widget) — session-alapú user/org link
      description: Rate limit "contact" (userId-alapú). Admin + org-tanácsadó notifot kap.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties: { message: { type: string, minLength: 10, maxLength: 4000 } }
      responses:
        "200": { description: OK }
        "429": { description: Rate limited }

  # ── Team ──────────────────────────────────────────────────────────────────
  /api/team:
    get: { tags: [Team], summary: Saját csapatok, responses: { "200": { description: OK } } }
    post:
      tags: [Team]
      summary: Csapat létrehozása (org-kontextusban, capability-gate)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                orgId: { type: string }
      responses: { "200": { description: OK } }
  /api/team/{id}/members:
    post:
      tags: [Team]
      summary: Org-tag hozzáadása csapathoz
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties: { userId: { type: string } }
      responses: { "200": { description: OK } }
  /api/team/{id}/members/{userId}:
    patch:
      tags: [Team]
      summary: Csapattag-szerep módosítása
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { type: string, enum: [member, manager] } }
      responses: { "200": { description: OK } }
    delete: { tags: [Team], summary: Csapattag eltávolítása, responses: { "200": { description: OK } } }
  /api/team/{id}/invite:
    post:
      tags: [Team]
      summary: Email-meghívó csapatba (TeamPendingInvite + join-link)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses: { "200": { description: "{ signUpUrl }" } }
  /api/team/invite:
    post:
      tags: [Team]
      summary: Nyílt (reusable) meghívó-link generálása
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties: { teamId: { type: string } }
      responses: { "200": { description: "{ inviteUrl, inviteId }" } }
  /api/team/join:
    post:
      tags: [Team]
      summary: Csatlakozás csapathoz meghívó-id-vel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [inviteId]
              properties: { inviteId: { type: string } }
      responses: { "200": { description: OK } }
  /api/team/pending-invite/{id}:
    delete: { tags: [Team], summary: Függő meghívó visszavonása, responses: { "200": { description: OK } } }
  /api/team/pending-invite/{id}/resend:
    post: { tags: [Team], summary: Függő meghívó újraküldése, responses: { "200": { description: OK } } }
  /api/team/{id}/pattern:
    get:
      tags: [Team]
      summary: Csapat-mintázat (TRITAN-aggregátum) — csapat-hozzáférés kell
      responses: { "200": { description: OK }, "403": { description: FORBIDDEN } }
  /api/team/{id}/report:
    post: { tags: [Team], summary: Csapat-riport draft létrehozása (tanácsadó), responses: { "200": { description: OK } } }
    patch:
      tags: [Team]
      summary: Riport mentés / előnézet / publikálás / visszavonás
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reportId]
              properties:
                reportId: { type: string }
                action: { type: string, enum: [save, preview, publish, unpublish], default: save }
      responses: { "200": { description: OK } }
    delete: { tags: [Team], summary: Riport törlése, responses: { "200": { description: OK } } }
  /api/team/{id}/report/translate:
    post:
      tags: [Team]
      summary: Riport EN-fordítás flow
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reportId]
              properties: { reportId: { type: string } }
      responses: { "200": { description: OK } }
  /api/team/role-round:
