  # `/api/org/{id}/campaigns/{campaignId}/remind` küldi.
  /api/org/{id}/inquiries:
    patch:
      tags: [Org, Inquiry]
      summary: Org-hoz kötött kérdés kezelése (tanácsadó; státusz + jegyzet)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [inquiryId, action]
              properties:
                inquiryId: { type: string }
                action: { type: string, enum: [set_status, set_note] }
                status: { type: string, enum: [NEW, IN_PROGRESS, CLOSED] }
                note: { type: string, maxLength: 4000 }
      responses: { "200": { description: OK }, "403": { description: FORBIDDEN } }
  /api/org/{id}/campaigns:
    get: { tags: [Org], summary: Kampányok listája (org-tag), responses: { "200": { description: OK } } }
    post:
      tags: [Org]
      summary: Kampány létrehozása (tanácsadói felület + launchCampaign capability)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                presetId:
                  type: string
                  enum: [SCAN_V1]
                  description: A nevesített preset lépéssora draftban is változtathatatlan.
                type: { type: string, enum: [SELF_ASSESSMENT, OBSERVER_360, TEAM_ROLE, TEAM_ROLE_360, TRUST_360, PSYCH_SAFETY, PEER_FEEDBACK] }
                types:
                  type: array
                  minItems: 1
                  maxItems: 7
                  items: { type: string, enum: [SELF_ASSESSMENT, OBSERVER_360, TEAM_ROLE, TEAM_ROLE_360, TRUST_360, PSYCH_SAFETY, PEER_FEEDBACK] }
                teamId: { type: string }
                teamIds: { type: array, maxItems: 50, items: { type: string } }
                allowExternalObservers: { type: boolean, default: false }
                stepIntervalHours: { type: integer, minimum: 0, maximum: 168, default: 24 }
                peerFeedbackAnonymous: { type: boolean, default: false }
                requireFreshResults: { type: boolean, default: false }
      responses: { "201": { description: Created } }
  /api/org/{id}/campaigns/{campaignId}:
    get: { tags: [Org], summary: Kampány részletei, responses: { "200": { description: OK } } }
    patch:
      tags: [Org]
      summary: Kampánystátusz-váltás vagy custom draft szerkesztése
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties: { status: { type: string, enum: [DRAFT, ACTIVE, CLOSED] } }
                - type: object
                  required: [action]
                  properties:
                    action: { type: string, const: edit_draft }
                    types:
                      type: array
                      minItems: 1
                      maxItems: 7
                      description: Csak preset nélküli custom kampánynál módosítható.
                      items: { type: string, enum: [SELF_ASSESSMENT, OBSERVER_360, TEAM_ROLE, TEAM_ROLE_360, TRUST_360, PSYCH_SAFETY, PEER_FEEDBACK] }
                    teamId: { type: [string, "null"] }
                    teamIds: { type: array, maxItems: 50, items: { type: string } }
                    stepIntervalHours: { type: integer, minimum: 0, maximum: 168 }
                    peerFeedbackAnonymous: { type: boolean }
                    name: { type: string, maxLength: 100 }
                    description: { type: [string, "null"], maxLength: 500 }
      responses:
        "200": { description: OK }
        "409": { description: Érvénytelen állapotváltás vagy rögzített preset-lépéssor }
    post:
      tags: [Org]
      summary: Résztvevők hozzáadása
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
      responses: { "200": { description: OK } }
