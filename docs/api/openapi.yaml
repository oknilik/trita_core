      - { name: id, in: path, required: true, schema: { type: string } }
    patch: { tags: [Admin], summary: Aktivitás módosítása, responses: { "200": { description: OK } } }
    delete: { tags: [Admin], summary: Aktivitás törlése, responses: { "200": { description: OK } } }
  /api/admin/crm/quotes:
    post: { tags: [Admin], summary: Ajánlat létrehozása, responses: { "201": { description: Created } } }
  /api/admin/crm/quotes/{id}:
    parameters:
