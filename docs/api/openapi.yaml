            schema:
              oneOf:
                - type: object
                  required: [action, stepIntervalHours]
                  properties:
                    action: { type: string, const: interval }
                    stepIntervalHours: { type: integer, minimum: 0, maximum: 168 }
                - type: object
                  required: [action]
                  properties: { action: { type: string, const: release_now } }
      responses: { "200": { description: OK } }
  /api/org/{id}/campaigns/{campaignId}/remind:
