    post: { tags: [Admin], summary: Küldés most / teszt-küldés, responses: { "200": { description: OK } } }
  /api/admin/newsletter/issues:
    post: { tags: [Admin], summary: Szerkesztett hírlevél-szám létrehozása, responses: { "201": { description: Created } } }
    patch: { tags: [Admin], summary: Szám szerkesztése / publikálása, responses: { "200": { description: OK } } }
    delete: { tags: [Admin], summary: Szám törlése, responses: { "200": { description: OK } } }
  /api/admin/quote/rates:
    get: { tags: [Admin], summary: Ajánlat-díjszabás lekérése, responses: { "200": { description: OK } } }
    put: { tags: [Admin], summary: Ajánlat-díjszabás mentése, responses: { "200": { description: OK } } }

  # ── Admin: CRM ─────────────────────────────────────────────────────
  /api/admin/crm/deals:
    get: { tags: [Admin], summary: Deal-lista (pipeline), responses: { "200": { description: OK } } }
    post: { tags: [Admin], summary: Deal létrehozása (intake), responses: { "201": { description: Created } } }
  /api/admin/crm/deals/{id}:
    parameters:
